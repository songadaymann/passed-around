name: Checks
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift run --package-path macos PrivacyChecks
      - run: swift build --package-path macos --product PassedAround
